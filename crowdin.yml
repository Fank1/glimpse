# Crowdin configuration for Glimpse.
#
# Read by BOTH the crowdin CLI and the GitHub integration (the integration
# looks for it in the root of each configured branch).
#
# Paths are relative to the REPO root, and the repo root is this directory:
# Fank1/glimpse is the glimpse repo; the plugin lives under plugin/.
#
# NO CREDENTIALS HERE. project_id and api_token come from the environment
# (CROWDIN_PROJECT_ID / CROWDIN_PERSONAL_TOKEN) so this file stays safe to
# commit to a public repo.
#
# ── ALWAYS PASS -b main TO THE CLI ────────────────────────────────────────────
# The GitHub integration owns the source files. It puts them in the Crowdin
# branch `main`, at /main/plugin/l10n/templates/. A crowdin command WITHOUT
# `-b main` writes a SECOND copy at the top level instead, and Crowdin then
# counts every string twice: each language reads about 50%, whatever the real
# state is. That happened on 2026-08-29 and was cleaned up on 2026-09-07 by
# deleting the top-level copy (file ids 18 and 20).
#
# Crowdin's config schema has no key for this, so it is a rule, not a setting:
#     crowdin upload sources       -b main
#     crowdin upload translations  -b main
#     crowdin download             -b main
#
# ── THE LANGUAGE MAPPING IS THE DANGEROUS PART ────────────────────────────────
# At runtime the plugin loads:
#     l10n/<KOReader's gettext current_lang>/glimpse.mo
# so the directory has to carry KOReader's code. Crowdin's default
# %locale_with_underscore% emits de_DE where KOReader wants plain de — and a
# .mo in the wrong directory is built, shipped, and silently never loaded. No
# error, no warning, just an untranslated UI.
#
# KEYS ARE CROWDIN LANGUAGE IDS (`de`, `es-ES`, `pt-BR`), NOT the emitted
# %locale_with_underscore% value. Getting that backwards is exactly how the
# first sync produced 22 wrong directories on 2026-08-10: keys read `de_DE`,
# Crowdin looked up `de`, found nothing, and used its default.
#
# Generated from Crowdin's live language list
# (GET https://api.crowdin.com/api/v2/languages, public, no auth) cross-checked
# against plugin/l10n/LOCALES. Regenerate rather than hand-edit; verify with
# builder/check_crowdin_map.py. Human-readable table: l10n/CROWDIN-LANGUAGES.txt
#
# No YAML anchors/aliases here on purpose — they aren't in Crowdin's documented
# config schema, so the mapping is written out twice rather than shared.
"preserve_hierarchy": true

files:
  # Required set — menus, buttons, dialogs, notifications (139 strings).
  - source: /plugin/l10n/templates/glimpse-labels.pot
    translation: /plugin/l10n/%locale_with_underscore%/labels.po
    languages_mapping:
      locale_with_underscore:
        af: af_ZA
        ar: ar
        be: be
